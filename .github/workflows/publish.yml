# npm에 올리기. 터미널 없이 GitHub 화면에서 버튼으로 실행한다.
#
# 준비 (한 번만, 폰 브라우저로 가능):
#   1. npmjs.com 가입
#   2. npmjs.com → 프로필 → Access Tokens → Generate New Token → Classic → Automation
#   3. 이 저장소 → Settings → Secrets and variables → Actions → New repository secret
#      이름 NPM_TOKEN, 값은 2에서 받은 토큰
#
# 올릴 때:
#   Actions 탭 → "npm에 올리기" → Run workflow
#   package.json의 version을 그대로 올린다. 이미 올라간 번호면 실패하니 먼저 올려 둘 것.
name: npm에 올리기

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "연습만 하고 실제로 올리지는 않기"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # prepare 스크립트가 여기서 라이브러리를 빌드한다.
      - run: npm ci

      - name: 테스트
        run: npm test

      - name: 편집기 빌드까지 깨지지 않는지
        run: npm run build

      - name: 올릴 내용 확인
        run: npm pack --dry-run

      - name: 올리기
        if: ${{ !inputs.dry-run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 결과
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "### 연습 실행 — 실제로 올리지 않았습니다 (v$VERSION)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### puppetforge v$VERSION 올렸습니다" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "npm install puppetforge@$VERSION" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
